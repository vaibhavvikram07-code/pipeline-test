trigger:

- main

pool:

vmImage: 'ubuntu-latest'

steps:

# Terraform Install

- task: TerraformInstaller@1

inputs:

terraformVersion: 'latest'
# Terraform Init

- script: |

cd pipeline-test

terraform init

displayName: 'Terraform Init'

# Terraform Validate

- script: |

cd pipeline-test

terraform validate

displayName: 'Terraform Validate'

# Terraform Plan

- script: |

cd pipeline-test

terraform plan -out=tfplan

displayName: 'Terraform Plan'

# Terraform Apply